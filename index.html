<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Save the date for Rosalie and Holly’s wedding on October 23, 2027." />
    <title>Rosalie &amp; Holly’s Wedding — Save the Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="invitation">
      <div class="sun" aria-hidden="true"></div>
      <section class="collage" aria-label="Photos of Rosalie and Holly">
        <figure class="photo photo--celebration"><img src="assets/photos/celebration.jpg" alt="Rosalie and Holly dressed up and smiling together" /></figure>
        <figure class="photo photo--kiss"><img src="assets/photos/kiss.jpg" alt="Rosalie and Holly smiling close together" /></figure>
        <figure class="photo photo--bikes"><img src="assets/photos/bikes.jpg" alt="Rosalie and Holly on a sunny bike ride" /></figure>
        <figure class="photo photo--closeup"><img src="assets/photos/closeup.jpg" alt="Rosalie and Holly touching foreheads" /></figure>
        <figure class="photo photo--portrait"><img src="assets/photos/portrait.jpg" alt="Rosalie and Holly in formal attire" /></figure>
      </section>
      <section class="content" aria-labelledby="wedding-title">
        <p class="eyebrow">Save the Date</p>
        <div class="rule" aria-hidden="true"><span></span></div>
        <h1 id="wedding-title"><span>Rosalie &amp;</span><span>Holly’s</span><span>Wedding</span></h1>
        <div class="details"><p>Oct 23, 2027</p><p>San Francisco, CA</p></div>
        <p class="invitation-line">You’re invited!</p>
      </section>
      <svg class="flower flower--top" viewBox="0 0 220 188" aria-hidden="true">
        <path d="M184 180C154 143 139 108 144 19M144 93c-23-3-46-20-58-46M150 120c23-17 42-20 63-16" class="stem" />
        <g class="petals"><path d="M142 38c-19-21-9-37 6-22 15-19 30-1 8 21 14 21-13 29-14 1Z"/><path d="M84 50c-14-19-4-29 8-16 9-18 24-3 5 16 12 16-11 24-13 0Z"/><path d="M205 105c-13-17-3-27 8-14 10-17 23 0 5 15 12 17-11 22-13-1Z"/></g>
        <g class="leaves"><path d="M145 93c-20-13-31-7-38 9 17 7 30 3 38-9Z"/><path d="M149 122c13-17 26-20 36-8-10 14-23 17-36 8Z"/></g>
      </svg>
    </main>
  </body>
</html>
