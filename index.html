<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Save the date for Rosalie and Holly’s wedding on October 23, 2027." />
    <title>Rosalie &amp; Holly’s Wedding — Save the Date</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=DM+Mono:wght@400;500&family=Great+Vibes&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="invitation">
      <section class="collage" aria-label="Photos of Rosalie and Holly">
        <figure class="photo photo--tuxedo" tabindex="0" role="button" aria-pressed="false"><img src="assets/photos/tuxedo-kiss.jpg" alt="Rosalie in a tuxedo with a purple bow tie kissing Holly’s cheek" /></figure>
        <figure class="photo photo--glasses" tabindex="0" role="button" aria-pressed="false"><img src="assets/photos/glasses-hat.jpg" alt="Rosalie and Holly in yellow glasses and a blue hat against carved stone" /></figure>
        <figure class="photo photo--paris" tabindex="0" role="button" aria-pressed="false"><img src="assets/photos/paris-river.jpg" alt="The river and bridge in Paris" /></figure>
        <figure class="photo photo--restaurant" tabindex="0" role="button" aria-pressed="false"><img src="assets/photos/restaurant-faces.jpg" alt="Rosalie and Holly making wide-eyed faces at a restaurant" /></figure>
        <figure class="photo photo--nose" tabindex="0" role="button" aria-pressed="false"><img src="assets/photos/nose-to-nose.jpg" alt="Rosalie and Holly smiling nose to nose in purple" /></figure>
        <figure class="photo photo--neon" tabindex="0" role="button" aria-pressed="false"><img src="assets/photos/neon-sunglasses.jpg" alt="Rosalie and Holly in black sunglasses under neon light" /></figure>
        <figure class="photo photo--fireplace" tabindex="0" role="button" aria-pressed="false"><img src="assets/photos/fireplace-formalwear.jpg" alt="Rosalie and Holly in formalwear in front of an ornate fireplace" /></figure>
        <figure class="photo photo--door" tabindex="0" role="button" aria-pressed="false"><img src="assets/photos/blue-door.jpg" alt="Rosalie and Holly in two suits at a blue industrial door" /></figure>
      </section>
      <section class="content" aria-labelledby="wedding-title">
        <p class="eyebrow">Save the Date</p>
        <h1 id="wedding-title"><span>Rosalie &amp;</span><span>Holly’s</span><span>Wedding</span></h1>
        <div class="details"><p>Oct 23, 2027</p><p>San Francisco, CA</p></div>
        <p class="invitation-line">You’re invited!</p>
      </section>
    </main>
    <script>
      const photos = document.querySelectorAll(".photo");
      const selectPhoto = (selectedPhoto) => {
        photos.forEach((photo) => {
          const isSelected = photo === selectedPhoto;
          photo.classList.toggle("is-selected", isSelected);
          photo.setAttribute("aria-pressed", String(isSelected));
        });
      };

      photos.forEach((photo) => {
        photo.addEventListener("click", () => selectPhoto(photo));
        photo.addEventListener("keydown", (event) => {
          if (event.key === "Enter" || event.key === " ") {
            event.preventDefault();
            selectPhoto(photo);
          }
        });
      });
    </script>
  </body>
</html>
