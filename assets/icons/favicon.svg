<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Pink heart on a cream background">
  <!-- The heart is Phosphor's "heart-fill" glyph: the path below is copied verbatim from
       https://unpkg.com/@phosphor-icons/core@2.1.1/assets/fill/heart-fill.svg (viewBox 0 0 256 256),
       only translated and scaled to sit centred on the tile. Do not redraw this path by hand.
